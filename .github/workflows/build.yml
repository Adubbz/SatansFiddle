name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LLDB development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends llvm-dev liblldb-dev

      - name: Install Rust target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Build release binary
        run: |
          LLDB_INCLUDE="$(llvm-config --includedir)" \
          LLDB_LIB_DIR="$(llvm-config --libdir)" \
          cargo build --locked --release --target x86_64-unknown-linux-gnu
